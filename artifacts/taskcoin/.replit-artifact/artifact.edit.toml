kind = "web"
previewPath = "/"
title = "TaskCoin"
version = "1.0.0"

[[services]]
localPort = 5173
name = "TaskCoin"
paths = ["/"]

[services.env]
PORT = "5173"
BASE_PATH = "/"

[services.development]
run = "pnpm --filter @workspace/taskcoin run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/taskcoin", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
